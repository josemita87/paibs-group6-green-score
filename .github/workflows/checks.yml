name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the eight data and model checks
        run: python prototype.py test
      - name: Run the claim-audit self-checks
        run: python contradictions.py test

      - name: Rebuild the figures from metrics.json
        run: |
          python make_figures.py
          git diff --exit-code results/figures
