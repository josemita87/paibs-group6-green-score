name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check data handling
        run: python -m unittest discover -s tests -v
      - name: Verify historical snapshot
        run: python scripts/audit_data.py
      - name: Verify expanded catalog and committed coverage report
        run: |
          python scripts/audit_data.py --catalog > /tmp/catalog_audit.json
          diff -u data/catalog_audit.json /tmp/catalog_audit.json
